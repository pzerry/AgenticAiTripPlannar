app:
  name: AI Travel Planner
  version: 1.0.0
  environment: development
  debug: true

llm:
  default_provider: groq

providers:

  groq:
    enabled: true
    model: llama-3.3-70b-versatile
    temperature: 0
    max_tokens: 4096
    timeout: 60

  qwen:
    enabled: true
    model: qwen/qwen3-32b
    temperature: 0
    max_tokens: 4096
    timeout: 60

weather:
  base_url: "https://api.openweathermap.org/data/2.5"
  timeout: 30
  units: metric

currency:
  base_url: "https://v6.exchangerate-api.com/v6"
  timeout: 20

flight:
  base_url: "https://serpapi.com/search.json"
  timeout: 30

activity:
  base_url: "https://serpapi.com/search.json"
  timeout: 30

hotel:
  base_url: "https://serpapi.com/search.json"
  timeout: 30
  
travel:

  currency: GBP

logging:

  level: INFO